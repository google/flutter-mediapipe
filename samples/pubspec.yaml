name: mediapipe_samples
description: The docs' Dart samples, one file each. Analyzed only.
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  mediapipe_audio:
    path: ../packages/mediapipe-task-audio
  mediapipe_core:
    path: ../packages/mediapipe-core
  mediapipe_decision:
    path: ../packages/mediapipe-task-decision
  mediapipe_retrieval:
    path: ../packages/mediapipe-task-retrieval
  mediapipe_text:
    path: ../packages/mediapipe-task-text
  mediapipe_vision:
    path: ../packages/mediapipe-task-vision
  web: ^1.1.1

# The families depend on mediapipe_core from pub.dev; the samples compile
# against this checkout's copy.
dependency_overrides:
  mediapipe_core:
    path: ../packages/mediapipe-core
