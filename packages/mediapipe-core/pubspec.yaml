name: mediapipe_core
description: "Shared layer for the MediaPipe task packages: Google's engine on each platform, verified downloads, an on-demand model store and the browser runtime."
version: 0.1.0
repository: https://github.com/google/flutter-mediapipe/tree/main/packages/mediapipe-core
issue_tracker: https://github.com/google/flutter-mediapipe/issues
topics:
  - mediapipe
  - machine-learning
  - ffi

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.2.0
  code_assets: ^2.1.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: ^2.2.0
  http: ^1.6.0
  meta: ^1.18.0
  path_provider: ^2.1.5
  web: ^1.1.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0

flutter:
  assets:
    - path: assets/verified_runtime.js
      platforms: [web]
    - path: assets/task_bridge.js
      platforms: [web]
