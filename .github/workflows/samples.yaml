name: Samples

permissions:
  contents: read

# The samples build against the packages by path, so a package change can
# break them as much as a change to the samples.
on:
  push:
    branches: [main]
    paths:
      - samples/**
      - packages/mediapipe-core/**
      - packages/mediapipe-task-vision/**
      - gallery/packages/video_frames/**
      - .github/actions/setup/**
      - .github/workflows/samples.yaml
  pull_request:
    paths:
      - samples/**
      - packages/mediapipe-core/**
      - packages/mediapipe-task-vision/**
      - gallery/packages/video_frames/**
      - .github/actions/setup/**
      - .github/workflows/samples.yaml
  workflow_dispatch:

concurrency:
  group: samples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  object-detection:
    name: Object detection / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux also analyzes and runs the tests, which run Google's
          # detector on the host.
          - target: linux
            os: ubuntu-24.04
            build: flutter build linux --release
          - target: web
            os: ubuntu-24.04
            build: flutter build web --release
          - target: android
            os: ubuntu-24.04
            build: flutter build apk --release
          - target: macos
            os: macos-15
            build: flutter build macos --release
          - target: ios
            os: macos-15
            build: flutter build ios --release --no-codesign
          - target: windows
            os: windows-2025
            build: flutter build windows --release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: samples/object_detection
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: matrix.target == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup
        with:
          python: 'false'
          linux-profile: ${{ matrix.target == 'linux' && 'gallery' || 'none' }}
      # Gradle's own NDK and CMake downloads give up on one corrupt archive.
      - if: matrix.target == 'android'
        uses: ./.github/actions/android-ndk
      - run: flutter pub get
      - name: Bundle the model
        run: dart run mediapipe_core:bundle_models
      - if: matrix.target == 'linux'
        run: dart format --output=none --set-exit-if-changed lib test
      - if: matrix.target == 'linux'
        run: flutter analyze
      - if: matrix.target == 'linux'
        run: flutter test
      - run: ${{ matrix.build }}
